name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Deploy fires ONLY when the builder address repo variable is set.
    if: ${{ vars.BUILDER_ADDRESS != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build (MAINNET)
        run: npx vite build --base=/execution-link/
        env:
          VITE_HL_MAINNET: "true"
          VITE_BUILDER_ADDRESS: ${{ vars.BUILDER_ADDRESS }}
          VITE_FUNNEL_ENDPOINT: ${{ vars.FUNNEL_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
